[project]
name = "robot-scalping"
version = "0.1.0"
description = "Robot trading berbasis MetaTrader5 dan FastAPI"
requires-python = ">=3.11"

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
